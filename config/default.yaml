# Multibotnet v4.2.0 Configuration File (Optimized Version)
#
# Features:
# - Dynamic message type support
# - Compression (LZ4/ZLIB)
# - Thread pool parallel processing
# - Auto-reconnect with configurable retry strategy

# IP地址映射
IP:
  self: '*'                    # '*' 表示绑定所有本机IP
  localhost: '127.0.0.1'       # 本地回环
  robot1: '192.168.101.101'    # 机器人1
  robot2: '192.168.101.102'    # 机器人2
  robot3: '192.168.101.103'    # 机器人3
  server: '192.168.101.100'    # 中央服务器

# 发送话题配置
send_topics:
  # IMU数据发送
  - topic: /imu
    message_type: sensor_msgs/Imu
    max_frequency: 50          # 最大发送频率(Hz)
    bind_address: self         # 绑定地址(使用IP映射)
    port: 3001
    compression: true          # 启用压缩

  # 速度命令发送
  - topic: /cmd_vel
    message_type: geometry_msgs/Twist
    max_frequency: 40
    bind_address: self
    port: 3002
    compression: false        # 实时性要求高，不压缩

  # 激光雷达数据
  - topic: /scan
    message_type: sensor_msgs/LaserScan
    max_frequency: 10
    bind_address: self
    port: 3003
    compression: true

  # 点云数据
  - topic: /velodyne_points
    message_type: sensor_msgs/PointCloud2
    max_frequency: 10
    bind_address: self
    port: 3004
    compression: true

# 接收话题配置
recv_topics:
  # 接收其他机器人的IMU数据
  - topic: /robot1/imu
    message_type: sensor_msgs/Imu
    connect_address: robot1
    port: 3001

  - topic: /robot2/imu
    message_type: sensor_msgs/Imu
    connect_address: robot2
    port: 3001

  # 接收中央服务器的全局命令
  - topic: /global_cmd_vel
    message_type: geometry_msgs/Twist
    connect_address: server
    port: 3002

# 高级配置选项
advanced:
  # 压缩配置
  compression:
    enable: true              # 全局启用压缩
    type: lz4                 # 压缩算法: none, zlib, lz4
    level: 6                  # 压缩级别(仅zlib): 1-9

  # 线程池配置
  thread_pool:
    size: 4                   # 线程数，0表示自动(CPU核心数)

  # 性能监控
  performance:
    enable_statistics: true   # 启用统计
    statistics_interval_ms: 5000

  # 重试策略
  retry:
    max_retries: 3            # 最大重试次数
    interval_ms: 1000         # 重试间隔(毫秒)