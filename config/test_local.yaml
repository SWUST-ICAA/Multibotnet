# Multibotnet v4.2.0 本地回环测试配置 (Optimized Version)
# 用于在单机上测试话题通信

# IP地址映射
IP:
  self: '*'                    # 绑定所有本机IP
  localhost: '127.0.0.1'       # 本地回环

# 发送话题配置
send_topics:
  # IMU数据
  - topic: /imu
    message_type: sensor_msgs/Imu
    max_frequency: 50
    bind_address: self
    port: 3001
    compression: true

  # 速度命令
  - topic: /cmd_vel
    message_type: geometry_msgs/Twist
    max_frequency: 40
    bind_address: self
    port: 3002
    compression: true

  # 激光雷达数据
  - topic: /scan
    message_type: sensor_msgs/LaserScan
    max_frequency: 10
    bind_address: self
    port: 3003
    compression: true

# 接收话题配置
recv_topics:
  - topic: /topic_test/imu
    message_type: sensor_msgs/Imu
    connect_address: localhost
    port: 3001

  - topic: /topic_test/cmd_vel
    message_type: geometry_msgs/Twist
    connect_address: localhost
    port: 3002

  - topic: /topic_test/scan
    message_type: sensor_msgs/LaserScan
    connect_address: localhost
    port: 3003

# 高级配置选项
advanced:
  # 压缩配置
  compression:
    enable: true
    type: lz4
    level: 6

  # 线程池配置
  thread_pool:
    size: 4                   # 使用4个线程

  # 性能监控
  performance:
    enable_statistics: true
    statistics_interval_ms: 5000

  # 重试策略
  retry:
    max_retries: 3
    interval_ms: 500          # 本地测试，重试间隔短一些